task test {
    doLast {
        try {
            exec {
                workingDir project.projectDir
                println("Working dir: ${workingDir}")
                // 'bash' (not 'cmd') on every OS: the script is a Bash script, and Windows CI
                // runners provide Git Bash on PATH, but cmd.exe understands neither chmod nor ./.
                commandLine 'bash', "-c", "chmod +x ./build.sh && ./build.sh run"
            }
        } catch (Exception e) {
            println("Example Run failed: " + e.message)
            throw e
        }
    }
}

task build {
    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(":whatsapp.business-examples:test")) {
            build.enabled = false
        }
    }
    doLast {
        try {
            exec {
                workingDir project.projectDir
                println("Working dir: ${workingDir}")
                commandLine 'bash', "-c", "chmod +x ./build.sh && ./build.sh build"
            }
        } catch (Exception e) {
            println("Example Build failed: " + e.message)
            throw e
        }
    }
}

test.dependsOn ":whatsapp.business-ballerina:build"
build.dependsOn ":whatsapp.business-ballerina:build"
